name: verify

# Every required job must pass. Nothing here is marked continue-on-error: a failing
# check fails the run rather than being reported as advisory.
#
# Action versions are the lowest major that runs on Node 24, not the newest tag, so the
# runtime moves without the behaviour moving with it. GitHub began removing Node 20 from
# hosted runners in September 2026, which would have stopped the supply-chain job and with
# it the secret scan. Checked against action.yml on each major tag before choosing:
# upload-artifact v5 still resolves to node20 so v6 is the minimum; setup-python v7 removes
# the pip-install input and drops EOL Python versions; upload-artifact v7 switches to direct
# uploads. None of those changes is wanted here. gitleaks v3 is a pure runtime migration.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # Test-only values. Real deployments supply these through secrets.
  POSTGRES_PASSWORD: ci-postgres-password
  JWT_SECRET: ci-jwt-secret-value-at-least-thirty-two-characters
  S3_SECRET_KEY: ci-object-storage-secret
  S3_ACCESS_KEY: maanak
  # MinIO requires exactly 32 bytes after the colon. The previous value decoded to
  # "ci-test-kms-key-32-bytes-long!!", which is 31, so MinIO refused to start with
  # "invalid key length 31" and the live-stack job never got past starting the stack.
  MINIO_KMS_SECRET_KEY: maanak-evidence-key:Y2ktdGVzdC1rbXMta2V5LTMyLWJ5dGVzLWxvbmchISE=
  MAANAK_ENV: test

jobs:
  quality:
    name: format, lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install ruff==0.8.4 mypy==1.14.0

      - name: Formatting
        working-directory: api
        run: ruff format --check .

      - name: Lint
        working-directory: api
        run: ruff check .

      - name: Types
        working-directory: api
        run: mypy app

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt
          pip install pytest==8.3.4 pytest-asyncio==0.25.0 pytest-cov==6.0.0

      - name: Fast tests with coverage
        working-directory: api
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests -m "not integration and not browser" \
            --cov=app --cov-report=term-missing --cov-report=xml -q

      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: api/coverage.xml

  static-checks:
    name: prose, bindings, permissions and messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock.txt

      # check_permission_names.py imports app.security.permissions to compare the names
      # the interface uses against the real enum, so the application's dependencies have
      # to be present. The other three are standard library only.
      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      # These four read the tree and need no services. They were previously runnable but
      # unenforced, so the README could advertise a count that no run had ever produced:
      # check_js_bindings reported 26 modules in the documentation against 27 on disk.
      # Each now resolves its own paths and fails rather than passing on an empty scan.
      - name: Writing rules across pages and documents
        run: python api/scripts/check_prose.py web docs README.md

      - name: No module uses a helper it never imported
        run: python api/scripts/check_js_bindings.py

      - name: Every permission the interface names exists
        run: python api/scripts/check_permission_names.py

      - name: No error message names a schema or a column
        run: python api/scripts/check_error_messages.py

  migrations:
    name: migrations against real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: maanak
          POSTGRES_USER: maanak
          POSTGRES_PASSWORD: ci-postgres-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U maanak -d maanak"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.lock.txt

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock.txt

      - name: Upgrade to head
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://maanak:ci-postgres-password@localhost:5432/maanak
          PYTHONPATH: .
        run: alembic upgrade head

      - name: Downgrade and upgrade again
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://maanak:ci-postgres-password@localhost:5432/maanak
          PYTHONPATH: .
        run: |
          alembic downgrade 0001_initial_schema
          alembic upgrade head

      - name: Confirm no model drift
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://maanak:ci-postgres-password@localhost:5432/maanak
          PYTHONPATH: .
        run: |
          # An empty autogenerate means the migrations match the models.
          alembic revision --autogenerate -m drift-check --rev-id drift_check
          if grep -qE "op\.(create_table|drop_table|add_column|drop_column|alter_column)" \
              migrations/versions/drift_check_drift_check.py; then
            echo "Model drift detected. The migrations do not match app/models."
            cat migrations/versions/drift_check_drift_check.py
            exit 1
          fi
          rm migrations/versions/drift_check_drift_check.py

  integration:
    name: live-stack suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Write environment file
        run: |
          cp .env.example .env
          sed -i "s|CHANGE-ME-database-password|${POSTGRES_PASSWORD}|" .env
          sed -i "s|CHANGE-ME-random-secret-at-least-32-characters|${JWT_SECRET}|" .env
          sed -i "s|CHANGE-ME-object-storage-secret|${S3_SECRET_KEY}|" .env
          sed -i "s|maanak-evidence-key:CHANGE-ME-base64-32-byte-key|${MINIO_KMS_SECRET_KEY}|" .env

      - name: Start the stack
        run: |
          docker compose up -d --build --wait db redis minio
          docker compose run --rm migrate alembic upgrade head
          docker compose up -d --build api worker web
          # Wait for readiness rather than sleeping a fixed time.
          for attempt in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health/ready > /dev/null; then
              echo "ready after $((attempt * 3))s"; break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8000/health/ready

      - name: Run the live-stack suites
        run: |
          docker compose run --rm --no-deps \
            -e API_URL=http://api:8000 -e MAANAK_TEST_SCOPE=integration \
            --entrypoint sh api scripts/run_tests.sh

      - name: Browser and accessibility suite
        run: |
          # The suites above bootstrap their own workspace, so the data is reset first.
          # Without this, verify_browser.py finds an initialised workspace and cannot
          # sign in as the administrator it expects to create.
          docker compose run --rm --no-deps migrate python scripts/reset_data.py
          docker build -f api/Dockerfile.browser -t maanak-browser:ci api
          docker run --rm --network maanak_default \
            -v "$PWD/api:/w" -w /w -e BASE_URL=http://web:8080 maanak-browser:ci

      # Everything below was runnable but unenforced. The README advertises each of these
      # as a measured result, so CI is where the measurement has to happen.
      - name: Seed a real workspace
        run: |
          # verify_browser.py leaves the workspace it bootstrapped, so start again and
          # load the demo accounts, the rules and one complete worked example. The
          # screens that follow assert against real rows rather than empty states.
          docker compose run --rm --no-deps migrate python scripts/reset_data.py
          docker compose run --rm --no-deps -e API_URL=http://api:8000 \
            --entrypoint python api scripts/seed_demo.py
          docker compose run --rm --no-deps -e API_URL=http://api:8000 \
            --entrypoint python api scripts/seed_example.py
          # api/screenshots/ is not committed, so the readable label the officer flow
          # uploads has to be generated here.
          docker compose run --rm --no-deps --user root -v "$PWD/api:/app" \
            --entrypoint python api scripts/make_sample_label.py

      - name: Every page and workspace screen, axe and reflow
        run: |
          docker run --rm --network maanak_default -v "$PWD:/repo" -v "$PWD/api:/w" -w /w \
            -e BASE_URL=http://web:8080 -e API_URL=http://api:8000 maanak-browser:ci \
            python scripts/audit_app.py

      - name: The whole officer workflow through the interface
        run: |
          docker run --rm --network maanak_default -v "$PWD:/repo" -v "$PWD/api:/w" -w /w \
            -e BASE_URL=http://web:8080 -e API_URL=http://api:8000 maanak-browser:ci \
            python scripts/verify_officer_flow.py

      - name: Every API operation is reached from a screen or explained
        run: |
          docker run --rm --network maanak_default -v "$PWD:/repo" -w /repo \
            maanak-browser:ci python api/scripts/check_api_reach.py --base http://api:8000

      - name: The generated PDF and DOCX read correctly
        run: |
          docker compose run --rm --no-deps -e API_URL=http://api:8000 \
            --entrypoint python api scripts/check_report_text.py

      - name: Target size, sticky positioning and axe across the public pages
        run: |
          docker run --rm --network maanak_default -v "$PWD:/repo" -v "$PWD/api:/w" -w /w \
            -e BASE_URL=http://web:8080 maanak-browser:ci python scripts/measure_a11y.py

      - name: No warm-tinted surfaces
        run: |
          docker run --rm --network maanak_default -v "$PWD:/repo" -v "$PWD/api:/w" -w /w \
            -e BASE_URL=http://web:8080 maanak-browser:ci python scripts/scan_tints.py --app

      - name: No broken links or unresolved anchors
        run: |
          docker run --rm --network maanak_default -v "$PWD:/repo" -v "$PWD/api:/w" -w /w \
            -e BASE_URL=http://web:8080 maanak-browser:ci python scripts/check_links.py

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  supply-chain:
    name: dependency, secret and container scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans the range of commits a push introduced, so it needs their
          # parents. The default shallow clone fetches only the tip, and a push of more
          # than one commit then fails with "unknown revision" on the range rather than
          # on a finding. A scan that cannot read anything must not be mistaken for a
          # clean scan, and gitleaks is right to exit non-zero, so give it the history.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependency vulnerabilities
        working-directory: api
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement requirements.lock.txt --strict

      - name: Software bill of materials
        working-directory: api
        run: |
          pip install cyclonedx-bom==4.6.1
          # The flag is -o. --output-file is not an argument this version accepts, and
          # passing it failed the job with "unrecognized arguments".
          cyclonedx-py requirements requirements.lock.txt -o ../sbom.json

      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom.json

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the application image
        run: docker build -t maanak-api:ci api

      - name: Container vulnerability scan
        # The tag carries a v. Referencing 0.28.0 without it fails the whole job at
        # "Set up job" with "unable to find version", before any step runs.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: maanak-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  release-archive:
    name: archive integrity
    needs: [quality, unit, static-checks, migrations, integration, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the archive
        run: bash scripts/package.sh

      - name: Verify the archive extracts and is complete
        run: bash scripts/verify_package.sh

      - uses: actions/upload-artifact@v6
        with:
          name: maanak-release
          path: |
            dist/maanak.zip
            dist/maanak.zip.sha256
